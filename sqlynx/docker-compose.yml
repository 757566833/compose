version: '3.3'
services:
  app:
    image: ubuntu:jammy
    container_name: sqlstudio_server
    restart: always
    ports:
      - 18888:18888
    volumes:
      - ./sqlynx:/sqlynx
    command: sh -c "/sqlynx/maicong-sqlynx.sh; sh /sqlynx/maicong-sqlynx.sh start"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/18888' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s