
services:
  rancher:
    image: rancher/rancher:v2.4.9
    container_name: rancher
    privileged: true
    restart: unless-stopped
    ports:
      - "4000:80"
      - "4443:443"
    volumes:
      - ./data/lib:/var/lib
      - ./data/log:/var/log
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost:443/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s