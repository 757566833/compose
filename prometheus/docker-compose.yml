
services:
  rancher:
    image: prom/prometheus:v3.3.0
    container_name: prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s