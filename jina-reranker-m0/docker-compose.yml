services:
  jina-reranker-m0:
    image: jina-reranker-m0:latest
    container_name: jina-reranker-m0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # 使用所有可用显卡
              capabilities: [gpu]
    ports:
      - "8001:8000"
    volumes:
      # 映射宿主机的 ./temp_data 到容器的 /tmp，方便排查 + 复用磁盘
      - ./temp_data:/tmp
    restart: always
