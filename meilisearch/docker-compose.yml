
services:
  meilisearch:
    image: getmeili/meilisearch:v1.3
    ports:
      - "7700:7700"
    volumes:
      - ./meili_data:/meili_data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7700/health || curl -fsS http://localhost:7700/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s