services:
  audio-text:
    image: audio-text:latest
    container_name: audio-text
    # 核心配置：开启 GPU 支持
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # 使用所有可用显卡
              capabilities: [gpu]
    ports:
      - "8000:8000"
    volumes:
      # 映射宿主机的 /tmp/whisper 到容器的 /tmp
      # 这样可以利用宿主机磁盘，且方便你在宿主机查看任务进度
      - ./temp_data:/tmp
      - ./models:/models:ro   # 映射模型存储目录，设置为只读
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || wget -qO- http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s