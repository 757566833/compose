services:
  postgres:
    image: postgres:17.5
    container_name: postgres
    environment:
      POSTGRES_PASSWORD: my_password
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s