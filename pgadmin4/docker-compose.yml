services:
  pgadmin4:
    image: dpage/pgadmin4:9.9.0
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@fzcode.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    restart: always
    ports:
      - "30001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s