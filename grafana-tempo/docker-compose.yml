services:
  grafana-tempo:
    image: grafana/tempo:2.9.0
    container_name: grafana-tempo
    ports:
      - "3200:3200"
      - "24317:4317"
      - "24318:4318"
      # Jaeger 用的端口
      # - "14268:14268"
      # zipkin 用的端口
      # - "9411:9411"
    restart: unless-stopped
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml           # 挂配置文件
      - ./tempo-data:/var/tempo          # 挂数据目录
    command: [ "-config.file=/etc/tempo.yaml" ] # 指定启动参数
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

