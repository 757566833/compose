services:
  nexus3:
    image: sonatype/nexus3:3.76.0
    container_name: nexus3
    restart: always
    volumes:
      - ./nexus-data:/nexus-data
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
