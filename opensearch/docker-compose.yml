services:                                                                                                                                                                
    opensearch:
      image: opensearchproject/opensearch:3.3.0                                                                                                                            
      container_name: opensearch                                                                                                                                           
      restart: unless-stopped
      ports:                                                                                                                                                               
        - "9200:9200"
        - "9600:9600"           # performance-analyzer
      mem_limit: 4GB                                                                                                                                                       
      ulimits:
        memlock: { soft: -1, hard: -1 }                                                                                                                                    
        nofile:  { soft: 65536, hard: 65536 }                                                                                                                              
      environment:
        - discovery.type=single-node                                                                                                                                       
        - bootstrap.memory_lock=true
        - cluster.name=os-dev                                                                                                                                              
        - node.name=os-dev-0                                                                                                                                               
        - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"
        - DISABLE_SECURITY_PLUGIN=true                                                                                                                                     
        - DISABLE_INSTALL_DEMO_CONFIG=true
        # 让本机 ml 能力可用而不强求专用 ml 节点                                                                                                                           
        - plugins.ml_commons.only_run_on_ml_node=false                                                                                                                     
        - plugins.ml_commons.native_memory_threshold=99                                                                                                                    
      volumes:
        - ./osdata:/usr/share/opensearch/data
        - ./osplugins:/usr/share/opensearch/plugins   # 装的插件持久化
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 60s

    opensearch-dashboards:                                                                                                                                                 
      image: opensearchproject/opensearch-dashboards:3.3.0
      container_name: opensearch-dashboards                                                                                                                                
      restart: unless-stopped
      ports:                                                                                                                                                               
        - "5601:5601"
      environment:
        - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'
        - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
      depends_on: [ opensearch ]
      healthcheck:
        test: ["CMD-SHELL", "curl -fsS http://localhost:5601/api/status || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 10
        start_period: 60s                                                                                                                                                                                                                                                                                        
                                                                                                                                                                          