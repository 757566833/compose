services:                                                                                                                
    opensearch:                                             
      image: opensearchproject/opensearch:1.3.20
      container_name: opensearch                                                                                           
      ports:
        - "9200:9200"                                                                                                      
      mem_limit: 4GB                                        
      restart: unless-stopped
      ulimits:
        memlock:                                                                                                           
          soft: -1
          hard: -1                                                                                                         
        nofile:                                             
          soft: 65536
          hard: 65536
      volumes:
        - ./osdata:/usr/share/opensearch/data
        - ./osplugins:/usr/share/opensearch/plugins                                                                        
      environment:
        - discovery.type=single-node                                                                                       
        - bootstrap.memory_lock=true                        
        - "OPENSEARCH_JAVA_OPTS=-Xms2g -Xmx2g"                                                                             
        - DISABLE_SECURITY_PLUGIN=true            # dev 关 security，HTTP 直连
        - DISABLE_INSTALL_DEMO_CONFIG=true                                                                                 
                                                                                                                           
    opensearch-dashboards:                                                                                                 
      image: opensearchproject/opensearch-dashboards:1.3.18                                                                
      container_name: opensearch-dashboards                 
      restart: unless-stopped
      ports:                                                                                                               
        - "5601:5601"
      environment:                                                                                                         
        - 'OPENSEARCH_HOSTS=["http://opensearch:9200"]'     
        - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true  # 跟 OpenSearch 关 security 对齐