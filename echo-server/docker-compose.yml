
services:
  rancher:
    image: ealen/echo-server:0.9.2
    container_name: echo-server
    privileged: true
    restart: unless-stopped
    ports:
      - "10080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || curl -fsS http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s